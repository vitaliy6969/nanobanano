version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: ai_image_hub_db
    environment:
      POSTGRES_USER: ${DB_USER:-aiuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aipassword}
      POSTGRES_DB: ${DB_NAME:-ai_image_hub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aiuser} -d ${DB_NAME:-ai_image_hub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_image_hub_backend
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NANOBANANO_API_KEY=${NANOBANANO_API_KEY}
      - NANOBANANO_API_URL=${NANOBANANO_API_URL:-https://api.nanobanano.pro/v1}
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-aiuser}:${DB_PASSWORD:-aipassword}@db:5432/${DB_NAME:-ai_image_hub}
      - API_SECRET_TOKEN=${API_SECRET_TOKEN}
      - DEBUG=${DEBUG:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Streamlit Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ai_image_hub_frontend
    environment:
      - API_BASE_URL=http://backend:8000/api/v1
      - API_TOKEN=${API_SECRET_TOKEN}
    ports:
      - "8501:8501"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    name: ai_image_hub_network
